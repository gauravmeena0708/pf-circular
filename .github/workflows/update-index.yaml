name: Update EPF Circulars Search Index

permissions:
  contents: write

on:
  workflow_dispatch: # Allows manual triggering
  #schedule:
  #  - cron: '0 4 * * 1' # Example: Runs every Monday at 4 AM UTC (after metadata fetch)
  # Alternatively, to run after the metadata fetch workflow completes successfully:
  workflow_run:
    workflows: ["Fetch EPF India circulars"]
    types:
      - completed
    branches:
      - main # Or your default branch

jobs:
  update_index:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Or your preferred Python version

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies for indexing
        run: pip install requests beautifulsoup4 pymupdf pytesseract Pillow # All dependencies for --action index

      - name: Update reproduced text and rebuild static search assets
        run: python ./fetch.py --action index

      - name: Commit and push reproduced text and search assets
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --ff-only
          git add data/index-*.json data/search/
          if git diff --staged --quiet; then
            echo "No reproduced text or search asset changes."
          else
            git commit -m "Update EPFO reproduced text and search assets"
            git push
            echo "Updated data committed and pushed."
          fi
