name: Fetch EPF India circulars

permissions:
  contents: write

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
   - cron: '0 4 * * 1' # Example: Runs every Monday at 4 AM UTC (after metadata fetch)

jobs:
  fetch_data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install metadata dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch metadata and rebuild static search assets
        run: python ./fetch.py --action fetch

      - name: Rebuild topic explorer assets
        run: python ./fetch.py --action topics

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --ff-only
          git add data/metadata.json data/circulars-*.json data/search/ data/topics/
          # Commit only if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update EPFO circular metadata and search assets"
            git push
          fi
